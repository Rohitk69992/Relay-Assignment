[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-relay"
version = "1.0.0"
description = "The Relay: A resilient, grounded research-paper LLM pipeline and benchmarking framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal AI Engineer" }
]
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pypdf>=5.1.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.0",
    "pillow>=10.4.0",
    "numpy>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0"
]

[tool.setuptools.packages.find]
where = ["src"]
